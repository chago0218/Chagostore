<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>로그인</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#f5f5f5;
}


.login-box{

width:90%;
max-width:400px;

margin:80px auto;

background:white;

padding:30px;

border-radius:20px;

}



h1{

text-align:center;

margin-bottom:25px;

}



input{

width:100%;

padding:15px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

}



button{

width:100%;

padding:15px;

margin-top:10px;

border:none;

border-radius:10px;

background:#000;

color:white;

font-size:16px;

}



a{

display:block;

text-align:center;

margin-top:20px;

}


</style>


</head>


<body>


<div class="login-box">


<h1>
MY STORE
</h1>


<input 
id="email"
placeholder="이메일">


<input 
id="password"
type="password"
placeholder="비밀번호">



<button onclick="signup()">
회원가입
</button>


<button onclick="login()">
로그인
</button>



<a href="index.html">
메인으로
</a>


</div>




<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script src="firebase.js"></script>

<script src="auth.js"></script>


</body>

</html>
